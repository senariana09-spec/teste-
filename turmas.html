        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Desenhos</title>


    <style>

        /* =====================================
           CONFIGURAÇÕES GERAIS
        ===================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {

            font-family: Arial, sans-serif;

            background: #fff1b8;

            overflow-x: hidden;
            overflow-y: auto;

            color: #4b3027;
        }


        /* =====================================
           FUNDO
        ===================================== */

        .fundo {

            position: fixed;

            inset: 0;

            background: #fff1b8;

            z-index: 1;

            pointer-events: none;
        }

        .fundo img {

            width: 100%;
            height: 100%;

            object-fit: cover;
        }


        /* =====================================
           CABEÇALHO
        ===================================== */

        .cabecalho {

            position: fixed;

            top: 0;
            left: 0;

            width: 100%;
            height: 85px;

            background: #4b3027;

            border-top: 3px solid #3b2923;

            z-index: 100;
        }


        /* =====================================
           LOGO
        ===================================== */

        .logo {

            position: absolute;

            left: 20px;
            top: 10px;

            width: 65px;
            height: 65px;

            border-radius: 50%;

            overflow: hidden;
        }

        .logo img {

            width: 100%;
            height: 100%;

            object-fit: contain;
        }


        /* =====================================
           ABAS
        ===================================== */

        .abas {

            position: absolute;

            left: 157px;
            bottom: 0;

            display: flex;

            gap: 26px;

            align-items: flex-end;
        }

        .aba {

            width: 126px;
            height: 43px;

            background: white;

            border: none;

            border-radius: 20px 20px 0 0;

            cursor: pointer;

            transition: 0.2s;

            font-size: 18px;

            font-weight: bold;

            color: #4b3027;
        }

        .aba:hover {

            background: #f3f3f3;

            transform: translateY(5px);
        }


        /* =====================================
           PESQUISA
        ===================================== */

        .pesquisa {

            position: absolute;

            right: 126px;
            top: 19px;

            width: 405px;
            height: 49px;

            background: white;

            border-radius: 30px;

            display: flex;

            align-items: center;
        }

        .icone-pesquisa {

            margin-left: 20px;

            width: 35px;
            height: 40px;

            display: flex;

            align-items: center;
            justify-content: center;

            flex-shrink: 0;
        }

        .icone-pesquisa img {

            width: 30px;
            height: 40px;

            object-fit: contain;
        }

        .pesquisa input {

            width: 330px;
            height: 100%;

            margin-left: 14px;

            border: none;
            outline: none;

            background: transparent;

            font-size: 18px;

            color: #4b3027;
        }

        .pesquisa input::placeholder {

            color: #777;

        }


        /* =====================================
           CONTEÚDO
        ===================================== */

        .conteudo {

            position: relative;

            z-index: 20;

            width: 100%;

            min-height: calc(100vh - 85px);

            margin-top: 85px;

            padding: 0 30px 70px;

            background: #fff1b8;
        }


        /* =====================================
           TÍTULO
        ===================================== */

        .titulo-area {

            position: relative;

            width: 235px;
            height: 62px;

            margin-left: -30px;

            margin-bottom: 28px;

            background: white;

            border-radius: 0 13px 13px 0;

            display: flex;

            align-items: center;

            padding-left: 29px;
        }

        .titulo-area::after {

            content: "";

            position: absolute;

            right: -7px;
            top: 11px;

            width: 14px;
            height: 40px;

            background: white;

            clip-path: polygon(
                0 0,
                55% 12%,
                100% 25%,
                55% 38%,
                100% 50%,
                55% 62%,
                100% 75%,
                55% 88%,
                0 100%
            );
        }

        .titulo {

            color: #4b3027;

            font-size: 38px;

            line-height: 1;

            font-weight: 700;

            letter-spacing: -1px;
        }


        /* =====================================
           GRADE
        ===================================== */

        .grade-desenhos {

            width: 100%;

            max-width: 1120px;

            margin: 0 auto;

            display: grid;

            grid-template-columns:
                repeat(3, minmax(0, 1fr));

            gap: 70px 46px;
        }


        /* =====================================
           CARD
        ===================================== */

        .card-desenho {

            position: relative;

            width: 100%;

            height: 330px;

            padding: 15px 15px 12px;

            background: white;

            border: none;

            border-radius: 20px;

            cursor: pointer;

            text-align: left;

            color: #4b3027;

            box-shadow: none;

            transition:
                transform 0.18s ease,
                box-shadow 0.18s ease;
        }

        .card-desenho:hover {

            transform: translateY(-5px);

            box-shadow:
                0 8px 15px rgba(
                    75,
                    48,
                    39,
                    0.12
                );
        }


        /* =====================================
           IMAGEM
        ===================================== */

        .imagem-desenho {

            width: 100%;

            height: 245px;

            border-radius: 18px;

            background: #c4ddeb;

            overflow: hidden;

            cursor: pointer;
        }

        .imagem-desenho img {

            width: 100%;
            height: 100%;

            display: block;

            object-fit: cover;

            cursor: pointer;

            transition:
                transform 0.25s ease;
        }

        .card-desenho:hover
        .imagem-desenho img {

            transform: scale(1.03);
        }


        /* =====================================
           INFORMAÇÕES
        ===================================== */

        .informacoes {

            position: relative;

            height: 58px;

            padding-top: 8px;

            padding-right: 55px;
        }

        .nome-desenho {

            font-size: 14px;

            line-height: 15px;

            font-weight: 800;
        }

        .nome-autor {

            font-size: 14px;

            line-height: 15px;

            font-weight: 800;
        }


        /* =====================================
           ESTRELA
        ===================================== */

        .estrela {

            position: absolute;

            right: 0;

            bottom: -1px;

            width: 48px;
            height: 48px;

            background: #c7c7c7;

            clip-path: polygon(
                50% 0%,
                61% 35%,
                98% 35%,
                68% 57%,
                79% 94%,
                50% 72%,
                21% 94%,
                32% 57%,
                2% 35%,
                39% 35%
            );

            cursor: pointer;

            z-index: 5;
        }


        /* =====================================
           ESTRELA AMARELA AO CLICAR
        ===================================== */

        .estrela.ativa {

            background: #ffd83d;
        }


        /* =====================================
           MENSAGEM DE PESQUISA
        ===================================== */

        .sem-resultados {

            grid-column: 1 / -1;

            width: 100%;

            text-align: center;

            font-size: 22px;

            font-weight: bold;

            color: #4b3027;

            padding: 50px 20px;
        }


        /* =====================================
           DECORAÇÃO
        ===================================== */

        .decoracao {

            position: fixed;

            right: -80px;

            bottom: -75px;

            width: 270px;

            opacity: 0.13;

            pointer-events: none;

            z-index: 2;
        }


        /* =====================================
           RESPONSIVIDADE
        ===================================== */

            .grade-desenhos {

                gap: 32px 24px;
            }

            .card-desenho {

            }

    <script>


        /* =====================================
           ABRIR IMAGEM EM TAMANHO ORIGINAL
        ===================================== */

        function abrirImagem(numero, evento) {

            /*
                Impede que o clique na imagem
                também execute o clique do card.
            */

            evento.stopPropagation();


            /*
                Abre a página de visualização.
            */

            window.location.href =
                "visualizar.html?id=" + numero;

        }


        /* =====================================
           CARREGAR DESENHOS SALVOS
        ===================================== */

        function carregarDesenhos() {

            let desenhos = [];


            try {

                desenhos =
                    JSON.parse(
                        localStorage.getItem(
                            "miauseumDesenhos"
                        )
                    ) || [];

            } catch (erro) {

                console.error(
                    "Erro ao carregar desenhos:",
                    erro
                );

                desenhos = [];

            }


            /* =================================
               PASSAR POR CADA DESENHO
            ================================= */

            desenhos.forEach(
                function (desenho, indice) {

                    const numero =
                        indice + 1;


                    /* =================================
                       IMAGEM
                    ================================= */

                    const imagem =
                        document.getElementById(
                            "imagem" + numero
                        );


                    if (imagem) {

                        imagem.src =
                            desenho.imagem;

                        imagem.alt =
                            desenho.nome;

                    }


                    /* =================================
                       NOME DA OBRA
                    ================================= */

                    const nome =
                        document.getElementById(
                            "nome" + numero
                        );


                    if (nome) {

                        nome.textContent =
                            desenho.nome;

                    }


                    /* =================================
                       NOME DO AUTOR
                    ================================= */

                    const autor =
                        document.getElementById(
                            "autor" + numero
                        );


                    if (autor) {

                        autor.textContent =
                            desenho.autor;

                    }

                }
            );


            /*
                Atualiza a pesquisa depois
                de carregar os desenhos.
            */

            pesquisarDesenhos();

        }


        /* =====================================
           ABRIR DESENHO
        ===================================== */

        function abrirDesenho(numero) {

            console.log(
                "Desenho selecionado:",
                numero
            );


            let desenhos = [];


            try {

                desenhos =
                    JSON.parse(
                        localStorage.getItem(
                            "miauseumDesenhos"
                        )
                    ) || [];

            } catch (erro) {

                desenhos = [];

            }


            const desenho =
                desenhos[numero - 1];


            if (desenho) {

                console.log(
                    "Nome:",
                    desenho.nome
                );

                console.log(
                    "Autor:",
                    desenho.autor
                );

            }

        }


        /* =====================================
           ESTRELA INTERATIVA
        ===================================== */

        function alternarEstrela(evento, estrela) {

            /*
                Impede que o clique chegue
                ao botão do card.
            */

            evento.stopPropagation();


            /*
                Alterna entre cinza e amarelo.
            */

            estrela.classList.toggle("ativa");

        }


        /* =====================================
           PESQUISA DOS DESENHOS
        ===================================== */

        function pesquisarDesenhos() {

            const campo =
                document.getElementById(
                    "campoPesquisa"
                );


            if (!campo) {

                return;

            }


            /*
                Pega o que o usuário digitou.
            */

            const texto =
                campo.value
                    .toLowerCase()
                    .trim();


            /*
                Pega todos os cards.
            */

            const cards =
                document.querySelectorAll(
                    ".card-desenho"
                );


            let encontrados = 0;


            /*
                Verifica cada card.
            */

            cards.forEach(
                function (card) {

                    const nome =
                        card.querySelector(
                            ".nome-desenho"
                        );


                    const autor =
                        card.querySelector(
                            ".nome-autor"
                        );


                    const nomeTexto =
                        nome
                            ? nome.textContent
                                .toLowerCase()
                            : "";


                    const autorTexto =
                        autor
                            ? autor.textContent
                                .toLowerCase()
                            : "";


                    /*
                        Se a pesquisa estiver vazia,
                        todos os cards aparecem.
                    */

                    if (texto === "") {

                        card.style.display =
                            "";

                        encontrados++;

                        return;

                    }


                    /*
                        Procura no nome do desenho
                        OU no nome do autor.
                    */

                    const corresponde =
                        nomeTexto.includes(texto) ||
                        autorTexto.includes(texto);


                    if (corresponde) {

                        card.style.display =
                            "";

                        encontrados++;

                    } else {

                        card.style.display =
                            "none";

                    }

                }
            );


            /* =================================
               MENSAGEM SEM RESULTADOS
            ================================= */

            let mensagem =
                document.querySelector(
                    ".sem-resultados"
                );


            if (
                texto !== "" &&
                encontrados === 0
            ) {

                if (!mensagem) {

                    mensagem =
                        document.createElement(
                            "div"
                        );

                    mensagem.className =
                        "sem-resultados";

                    mensagem.textContent =
                        "Nenhum desenho encontrado.";


                    document
                        .getElementById(
                            "gradeDesenhos"
                        )
                        .appendChild(
                            mensagem
                        );

                }

            } else {

                if (mensagem) {

                    mensagem.remove();

                }

            }

        }


        /* =====================================
           ATIVAR PESQUISA
        ===================================== */

        document
            .getElementById(
                "campoPesquisa"
            )
            .addEventListener(
                "input",
                pesquisarDesenhos
            );


        /* =====================================
           CARREGAR AUTOMATICAMENTE
        ===================================== */

        carregarDesenhos();


    </script>


</body>
