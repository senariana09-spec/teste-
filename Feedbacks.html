<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Feedbacks</title>


    <style>

        /* =====================================
           CONFIGURAÇÕES GERAIS
        ===================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            font-family: "Arial Rounded MT Bold", Arial, sans-serif;

            background: #fff1b8;

            overflow-x: hidden;
        }


        /* =====================================
           CABEÇALHO
        ===================================== */

        .cabecalho {
            position: fixed;

            top: 0;
            left: 0;

            width: 100%;
            height: 85px;

            background: #4b3027;

            border-top: 3px solid #3b2923;

            z-index: 100;
        }


        /* =====================================
           LOGO
        ===================================== */

        .logo {
            position: absolute;

            left: 20px;
            top: 10px;

            width: 65px;
            height: 65px;

            border-radius: 50%;

            overflow: hidden;
        }

        .logo img {
            width: 100%;
            height: 100%;

            object-fit: contain;
        }


        /* =====================================
           ABAS
        ===================================== */

        .abas {
            position: absolute;

            left: 157px;
            bottom: 0;

            display: flex;

            gap: 26px;

            align-items: flex-end;
        }

        .aba {
            width: 126px;
            height: 43px;

            background: white;

            border: none;

            border-radius: 20px 20px 0 0;

            cursor: pointer;

            transition: 0.2s;

            font-size: 18px;
            font-weight: bold;

            color: #4b3027;
        }

        .aba:hover {
            background: #f3f3f3;

            transform: translateY(5px);
        }


        /* =====================================
           CONTEÚDO
        ===================================== */

        .conteudo {

            padding-top: 125px;
            padding-bottom: 80px;

            min-height: 100vh;

            background: #fff1b8;
        }


        /* =====================================
           TÍTULO
        ===================================== */

        .titulo {

            width: 650px;
            max-width: 90%;

            min-height: 120px;

            margin: 40px auto;

            background: white;

            border-radius: 25px;

            display: flex;

            align-items: center;
            justify-content: center;
        }

        .titulo h1 {

            color: #4b3027;

            font-size: 55px;

            text-align: center;
        }


        /* =====================================
           ÁREA DOS FEEDBACKS
        ===================================== */

        .lista-feedbacks {

            width: 100%;

            max-width: 900px;

            margin: 0 auto;

            padding: 20px;

            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 30px;

        }


        /* =====================================
           QUADRO DE FEEDBACK
        ===================================== */

        .quadro-feedback {

            background: #c5ddeb;

            border-radius: 25px;

            min-height: 200px;

            padding: 28px;

            box-shadow:
                0 5px 0 rgba(75, 48, 39, 0.15);

            position: relative;
        }


        /* =====================================
           TEXTO
        ===================================== */

        .texto-feedback {

            color: #4b3027;

            font-family: Arial, sans-serif;

            font-size: 18px;

            line-height: 1.5;

            white-space: pre-wrap;

            overflow-wrap: break-word;

            padding-bottom: 35px;
        }


        /* =====================================
           DATA
        ===================================== */

        .data-feedback {

            position: absolute;

            bottom: 18px;
            left: 28px;

            color: #6b5750;

            font-family: Arial, sans-serif;

            font-size: 13px;
        }


        /* =====================================
           SEM FEEDBACKS
        ===================================== */

        .nenhum-feedback {

            grid-column: 1 / -1;

            background: white;

            border-radius: 25px;

            padding: 45px;

            text-align: center;

            color: #4b3027;

            font-size: 22px;
        }


        /* =====================================
           BOTÃO VOLTAR
        ===================================== */

        .voltar {

            display: block;

            margin: 30px auto 0;

            padding: 13px 30px;

            background: white;

            border: none;

            border-radius: 15px;

            color: #4b3027;

            font-family:
                "Arial Rounded MT Bold",
                Arial,
                sans-serif;

            font-size: 17px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.2s;
        }

        .voltar:hover {

            transform: scale(1.05);
        }


        /* =====================================
           RESPONSIVIDADE
        ===================================== */

        @media (max-width: 900px) {

            .abas {

                left: 110px;

                gap: 10px;
            }

            .aba {

                width: 105px;
            }

            .lista-feedbacks {

                grid-template-columns: 1fr;

                max-width: 600px;
            }

            .titulo h1 {

                font-size: 45px;
            }
        }


        @media (max-width: 600px) {

            .abas {

                left: 90px;

                gap: 5px;
            }

            .aba {

                width: 80px;

                font-size: 14px;
            }

            .titulo {

                min-height: 100px;
            }

            .titulo h1 {

                font-size: 35px;
            }

            .lista-feedbacks {

                padding: 15px;
            }

            .quadro-feedback {

                padding: 22px;
            }

        }

    </style>

</head>


<body>


    <!-- =====================================
         CABEÇALHO
    ===================================== -->

    <header class="cabecalho">


        <!-- LOGO -->

        <div class="logo">

            <img
                src="kit.png"
                alt="Logo"
            >

        </div>


        <!-- ABAS -->

        <nav class="abas">

            <button
                class="aba"
                onclick="window.location.href='home.html'"
            >
                Home
            </button>


            <button
                class="aba"
                onclick="window.location.href='sobre.html'"
            >
                Sobre
            </button>


            <button
                class="aba"
                onclick="window.location.href='turmas.html'"
            >
                Desenhos
            </button>


            <button
                class="aba"
                onclick="window.location.href='avalie.html'"
            >
                Avalie
            </button>

        </nav>

    </header>


    <!-- =====================================
         CONTEÚDO
    ===================================== -->

    <main class="conteudo">


        <!-- TÍTULO -->

        <section class="titulo">

            <h1>
                Feedbacks
            </h1>

        </section>


        <!-- LISTA -->

        <section
            id="listaFeedbacks"
            class="lista-feedbacks"
        ></section>


        <!-- VOLTAR -->

        <button
            class="voltar"
            onclick="window.location.href='avalie.html'"
        >
            Voltar para Avalie
        </button>


    </main>


    <!-- =====================================
         JAVASCRIPT
    ===================================== -->

    <script>

        /* =====================================
           CARREGAR FEEDBACKS
        ===================================== */

        function carregarFeedbacks() {

            const lista =
                document.getElementById(
                    "listaFeedbacks"
                );


            /* Pega os feedbacks salvos */

            const feedbacks =
                JSON.parse(
                    localStorage.getItem(
                        "miauseumFeedbacks"
                    )
                ) || [];


            /* Se não houver feedbacks */

            if (feedbacks.length === 0) {

                lista.innerHTML = `

                    <div class="nenhum-feedback">

                        Ainda não existem feedbacks enviados.

                    </div>

                `;

                return;
            }


            /* Limpa a lista */

            lista.innerHTML = "";


            /* Mostra os feedbacks */

            feedbacks
                .slice()
                .reverse()
                .forEach(function (feedback) {


                    const quadro =
                        document.createElement("article");


                    quadro.className =
                        "quadro-feedback";


                    const texto =
                        document.createElement("div");


                    texto.className =
                        "texto-feedback";


                    texto.textContent =
                        feedback.texto;


                    const data =
                        document.createElement("div");


                    data.className =
                        "data-feedback";


                    data.textContent =
                        feedback.data;


                    quadro.appendChild(texto);

                    quadro.appendChild(data);

                    lista.appendChild(quadro);

                });

        }


        /* Carrega assim que a página abre */

        carregarFeedbacks();

    </script>

</body>

</html>
