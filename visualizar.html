<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Visualizar desenho</title>


    <style>

        /* =====================================
           CONFIGURAÇÕES GERAIS
        ===================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        html,
        body {
            width: 100%;
            min-height: 100%;
        }


        body {

            font-family: Arial, sans-serif;

            background: #fff1b8;

            color: #4b3027;

            overflow: auto;
        }


        /* =====================================
           CABEÇALHO
        ===================================== */

        .cabecalho {

            position: fixed;

            top: 0;
            left: 0;

            width: 100%;
            height: 85px;

            background: #4b3027;

            border-top: 3px solid #3b2923;

            z-index: 100;
        }


        /* =====================================
           LOGO
        ===================================== */

        .logo {

            position: absolute;

            left: 20px;
            top: 10px;

            width: 65px;
            height: 65px;

            border-radius: 50%;

            overflow: hidden;
        }


        .logo img {

            width: 100%;
            height: 100%;

            object-fit: contain;
        }


        /* =====================================
           ABAS
        ===================================== */

        .abas {

            position: absolute;

            left: 157px;
            bottom: 0;

            display: flex;

            gap: 26px;

            align-items: flex-end;
        }


        .aba {

            width: 126px;
            height: 43px;

            background: white;

            border: none;

            border-radius: 20px 20px 0 0;

            cursor: pointer;

            transition: 0.2s;

            font-size: 18px;

            font-weight: bold;

            color: #4b3027;
        }


        .aba:hover {

            background: #f3f3f3;

            transform: translateY(5px);
        }


        /* =====================================
           ÁREA DE VISUALIZAÇÃO
        ===================================== */

        .visualizacao {

            min-height: 100vh;

            padding-top: 115px;

            padding-bottom: 50px;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: flex-start;
        }


        /* =====================================
           BOTÃO VOLTAR
        ===================================== */

        .voltar {

            align-self: flex-start;

            margin-left: 30px;

            margin-bottom: 25px;

            padding: 12px 25px;

            background: white;

            border: none;

            border-radius: 15px;

            color: #4b3027;

            font-size: 18px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.2s;
        }


        .voltar:hover {

            transform: translateY(-2px);

            background: #f3f3f3;
        }


        /* =====================================
           IMAGEM ORIGINAL
        ===================================== */

        .imagem-original {

            width: auto;

            height: auto;

            max-width: none;

            display: block;

            border-radius: 15px;

            box-shadow:
                0 8px 25px rgba(
                    75,
                    48,
                    39,
                    0.20
                );
        }


        /* =====================================
           INFORMAÇÕES
        ===================================== */

        .informacoes {

            margin-top: 20px;

            text-align: center;

            font-weight: bold;

            font-size: 18px;

            background: white;

            padding: 12px 25px;

            border-radius: 15px;
        }


        /* =====================================
           RESPONSIVIDADE
        ===================================== */

        @media (max-width: 900px) {

            .abas {

                left: 110px;

                gap: 15px;
            }


            .aba {

                width: 110px;
            }


            .imagem-original {

                max-width: 95vw;

                height: auto;
            }
        }


        @media (max-width: 600px) {

            .abas {

                left: 90px;

                gap: 7px;
            }


            .aba {

                width: 85px;

                font-size: 14px;
            }


            .logo {

                left: 10px;

                width: 60px;
                height: 60px;
            }


            .voltar {

                margin-left: 15px;
            }


            .imagem-original {

                max-width: 95vw;

                height: auto;
            }
        }

    </style>

</head>


<body>


    <!-- =====================================
         CABEÇALHO
    ===================================== -->

    <header class="cabecalho">


        <!-- LOGO -->

        <div class="logo">

            <img
                src="kit.png"
                alt="Logo"
            >

        </div>


        <!-- ABAS -->

        <nav class="abas">

            <button
                class="aba"
                onclick="window.location.href='home.html'"
            >
                Home
            </button>


            <button
                class="aba"
                onclick="window.location.href='sobre.html'"
            >
                Sobre
            </button>


            <button
                class="aba"
                onclick="window.location.href='turmas.html'"
            >
                Desenhos
            </button>


            <button
                class="aba"
                onclick="window.location.href='avalie.html'"
            >
                Avalie
            </button>

        </nav>

    </header>


    <!-- =====================================
         VISUALIZAÇÃO
    ===================================== -->

    <main class="visualizacao">


        <!-- BOTÃO VOLTAR -->

        <button
            class="voltar"
            onclick="window.location.href='turmas.html'"
        >
            ← Voltar
        </button>


        <!-- IMAGEM ORIGINAL -->

        <img
            id="imagemOriginal"
            class="imagem-original"
            src=""
            alt="Desenho"
        >


        <!-- INFORMAÇÕES -->

        <div
            id="informacoes"
            class="informacoes"
        ></div>


    </main>


    <!-- =====================================
         JAVASCRIPT
    ===================================== -->

    <script>


        /* =====================================
           PEGAR ID DA URL
        ===================================== */

        const parametros =
            new URLSearchParams(
                window.location.search
            );


        const numero =
            Number(
                parametros.get("id")
            );


        /* =====================================
           ELEMENTOS
        ===================================== */

        const imagem =
            document.getElementById(
                "imagemOriginal"
            );


        const informacoes =
            document.getElementById(
                "informacoes"
            );


        /* =====================================
           DESENHOS SALVOS
        ===================================== */

        let desenhos = [];


        try {

            desenhos =
                JSON.parse(
                    localStorage.getItem(
                        "miauseumDesenhos"
                    )
                ) || [];

        } catch (erro) {

            desenhos = [];

        }


        /* =====================================
           DESENHO SELECIONADO
        ===================================== */

        const desenho =
            desenhos[numero - 1];


        if (desenho) {

            /*
                Se o desenho veio do sistema
                de envio, usa a imagem original
                armazenada no localStorage.
            */

            imagem.src =
                desenho.imagem;


            imagem.alt =
                desenho.nome ||
                "Desenho";


            informacoes.innerHTML =
                `
                    ${desenho.nome || "Desenho"}
                    <br>
                    ${desenho.autor || ""}
                `;

        } else {


            /* =================================
               DESENHOS PADRÃO
            ================================= */

            imagem.src =
                "desenho" +
                numero +
                ".png";


            imagem.alt =
                "Desenho " +
                numero;


            informacoes.textContent =
                "Desenho " +
                numero;

        }


        /* =====================================
           ERRO AO CARREGAR IMAGEM
        ===================================== */

        imagem.onerror =
            function () {

                informacoes.textContent =
                    "Não foi possível carregar esta imagem.";

            };

    </script>


</body>

</html>
